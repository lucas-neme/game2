<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frequência Zero</title><style>*{box-sizing:border-box}body{margin:0;background:#101b23;color:#e4e9dc;font:16px system-ui}header,aside{padding:18px;background:#1b2a33}header{display:flex;justify-content:space-between;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(0,1fr) 320px}canvas{width:100%;background:#132b32;image-rendering:pixelated;touch-action:none}button{background:#31544e;color:white;border:1px solid #80a797;padding:10px;margin:3px;border-radius:5px;cursor:pointer}h1{margin:0;font-size:24px}small{color:#a6b9b5}#log{min-height:100px;white-space:pre-wrap}#clues{line-height:1.6} @media(max-width:800px){main{display:block}}</style><header><h1>FREQUÊNCIA ZERO <small> / O último sinal</small></h1><span id="hud"></span></header><main><section><canvas id="world" width="960" height="620" aria-label="Mapa isométrico"></canvas><div id="controls"><button data-m="0,-1">↑</button><button data-m="-1,0">←</button><button data-m="1,0">→</button><button data-m="0,1">↓</button><button id="act">Investigar [E]</button><button id="wait">Esperar 1h</button><button id="save">Salvar</button><button id="reset">Recomeçar</button></div><small>WASD ou setas • aproxime-se de um ponto marcado • E para interagir</small></section><aside><h2>Diário de campo</h2><p id="log" aria-live="polite"></p><h3>Evidências</h3><div id="clues"></div><h3>Conversas</h3><div id="dialog"></div><h3>Casos em aberto</h3><div id="cases"></div><h3>Hipóteses</h3><button id="link">Cruzar evidências</button><button id="final">Decidir destino do sinal</button><p id="theory"></p></aside></main><script>
'use strict';
const $=id=>document.getElementById(id),c=$('world'),g=c.getContext('2d');
const sites=[{x:3,y:3,name:'Casa do tio',type:'house',id:'radio',text:'Uma fita registra uma transmissão às 03:17. O tio anotou: não é uma invasão, é um aviso.'},{x:8,y:3,name:'Clínica',type:'house',id:'clinic',text:'A médica Lia revela que os lapsos de memória coincidem com os pulsos do observatório.'},{x:3,y:9,name:'Arquivo municipal',type:'house',id:'file',text:'O Projeto Horizonte pretende amplificar o sinal no trigésimo dia. A ordem tem assinatura governamental.'},{x:10,y:9,name:'Observatório',type:'tower',id:'signal',text:'O espectrograma mostra duas frequências: uma de sincronização e outra que pode interrompê-la.'},{x:11,y:4,name:'Posto de vigilância',type:'house',id:'guard',text:'O agente Raul admite que o projeto foi infiltrado. Ele teme tanto os superiores quanto o sinal.'}];
sites.push(...[{"x":1,"y":6,"name":"Estação","type":"house","id":"rail","text":"Os trilhos têm riscos recentes. A placa diz: desativada em 1978."},{"x":12,"y":12,"name":"Lago","type":"tower","id":"lake","text":"O pescador anotou: luzes verdes após cada apagão; um ruído metálico vem da água."},{"x":7,"y":11,"name":"Rádio comunitária","type":"house","id":"future","text":"Uma gravação anuncia chuva amanhã e cita um acidente ainda não ocorrido."},{"x":1,"y":11,"name":"Fotógrafo","type":"house","id":"photo","text":"Uma fotografia de 1958 mostra uma menina idêntica à que aparece na praça hoje."},{"x":12,"y":1,"name":"Casa interditada","type":"house","id":"room","text":"A planta indica um cômodo atrás da parede norte. A parede tem sinais de reforma."}]);
const cases=[
{id:'train',title:'O trem das 03h17',need:['rail','radio','witness'],question:'O que os indícios demonstram?',options:['A ferrovia pode estar ativa clandestinamente.','O trem é certamente extraterrestre.','Nada acontece nos trilhos.'],answer:0,hint:'Compare o horário da fita com os sinais físicos e o testemunho.',result:'A ferrovia merece vigilância; sua origem ainda não está comprovada.'},
{id:'patient',title:'O paciente 47',need:['clinic','patient','file'],question:'Qual hipótese é sustentada pelos registros?',options:['Todos os médicos são extraterrestres.','Há tratamento omitido dos registros públicos.','O paciente nunca existiu.'],answer:1,hint:'Uma prescrição e um registro ausente podem coexistir.',result:'Há uma ocultação administrativa ligada ao projeto.'},
{id:'lakecase',title:'As luzes do lago',need:['lake','signal','outage'],question:'Qual relação deve ser investigada?',options:['O lago é uma nave, sem dúvida.','O pescador inventou tudo.','Os pulsos e as falhas elétricas parecem relacionados.'],answer:2,hint:'Compare os horários, não a aparência das luzes.',result:'Existe correlação temporal; a causa física ainda é desconhecida.'}];
const notes={witness:'Raul: ouvi um trem às 03h17. Não vi o maquinista.',patient:'Lia: a farmácia recebe prescrições para o paciente 47; o cadastro foi removido.',outage:'Rádio: o livro de ocorrências lista apagões às mesmas horas dos pulsos.'};
const fresh=()=>({x:5,y:5,t:480,clues:[],theory:false,end:null,trust:0,relations:{},solved:[],attempts:{}});let s=fresh();$('dialog').replaceChildren();try{const a=JSON.parse(localStorage.getItem('fz-v1'));if(a&&Number.isFinite(a.x)&&Number.isFinite(a.y)&&Number.isFinite(a.t)&&Array.isArray(a.clues)&&a.x>=0&&a.x<14&&a.y>=0&&a.y<14)s=a}catch{}
s.relations??={};s.solved??=[];s.attempts??={};
const say=t=>{$('log').textContent=t};const day=()=>1+Math.floor(s.t/1440),hour=()=>Math.floor(s.t%1440/60);
function advance(n){s.t+=n;if(day()>30&&!s.end){s.end='O pulso foi ativado. Vale do Cedro perdeu contato com o mundo.';say(s.end)}}
function move(dx,dy){if(s.end)return;let x=s.x+dx,y=s.y+dy;if(x<0||y<0||x>=14||y>=14||sites.some(a=>a.x===x&&a.y===y))return;s.x=x;s.y=y;$('dialog').replaceChildren();advance(8);render()}
function interact(){if(s.end)return;let a=sites.find(a=>Math.abs(a.x-s.x)+Math.abs(a.y-s.y)<=1);if(!a){say('Aproxime-se de um edifício marcado.');return}if(a.id==='guard'&&(hour()<18&&hour()>5)){say('Raul só fala depois das 18h.');return}if(a.id==='clinic'&&(hour()<8||hour()>=18)){say('A clínica funciona das 08h às 18h.');return}if(!s.clues.includes(a.id)){s.clues.push(a.id);advance(40)}say(a.text);dialog(a);render()}
function dialog(a){const el=$('dialog');el.replaceChildren();const lines={
clinic:[['Perguntar com discrição','Lia: Você sabe o que é guardar um segredo para proteger alguém?',1],['Mostrar a fita do tio','Lia: Ele me pediu para nunca deixar o paciente sozinho.',1,'patient','radio'],['Acusar a clínica','Lia: Sem provas, não temos mais nada a conversar.',-1]],
guard:[['Ouvir sem pressionar','Raul: Nem todo homem de uniforme escolheu estar aqui.',1],['Perguntar sobre a ferrovia','Raul: Eu estava de guarda naquela madrugada.',1,'witness','rail']],
future:[['Pedir o livro de ocorrências','Locutora: Anotei os horários. Ninguém quis me ouvir.',1,'outage']],
photo:[['Perguntar sobre a menina','Fotógrafo: Pode ser uma parente. Mas o medalhão é o mesmo.',1]],
room:[['Examinar a parede','Há tinta recente. Isso não prova que exista uma passagem.',0]]};
for(const [label,line,delta,clue,required] of lines[a.id]||[]){const b=document.createElement('button');b.textContent=label;b.disabled=!!required&&!s.clues.includes(required);b.onclick=()=>{if(s.end)return;if(Math.abs(a.x-s.x)+Math.abs(a.y-s.y)>1){say('Volte ao local para conversar.');return}const key=a.id+':'+label;if(!s.attempts[key]){s.attempts[key]=1;s.relations[a.id]=Math.max(-3,Math.min(3,(s.relations[a.id]||0)+delta));advance(15)}if(clue&&!s.clues.includes(clue)&&s.relations[a.id]>=0)s.clues.push(clue);say(line);render()};el.append(b)}}
function caseboard(){const el=$('cases');el.replaceChildren();for(const k of cases){const box=document.createElement('div');const title=document.createElement('p');title.textContent=k.title+' — '+(s.solved.includes(k.id)?'Resolvido':k.need.filter(n=>s.clues.includes(n)).length+'/'+k.need.length+' indícios');box.append(title);if(!s.solved.includes(k.id)){const hint=document.createElement('button');hint.textContent='Revisar pistas';hint.onclick=()=>say(k.hint);box.append(hint);if(k.need.every(n=>s.clues.includes(n))){const q=document.createElement('p');q.textContent=k.question;box.append(q);k.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(s.end)return;if(i===k.answer){s.solved.push(k.id);say(k.result);render()}else say('Essa conclusão vai além dos fatos. '+k.hint)};box.append(b)})}}el.append(box)}}
function link(){if(s.end)return;if(['radio','clinic','file','signal'].every(x=>s.clues.includes(x))){s.theory=true;say('Hipótese confirmada: o governo está amplificando um sinal de sincronização. A frequência inversa pode impedir o evento.')}else say('Ainda faltam evidências independentes para sustentar a hipótese.');render()}
function finish(){if(s.end)return;if(!s.theory){say('Sem uma hipótese confirmada, agir seria precipitado.');return}if(Math.abs(s.x-10)+Math.abs(s.y-9)>1){say('Vá ao observatório para alterar o transmissor.');return}let choice=prompt('1 — Inverter a frequência e divulgar as provas. 2 — Desligar o transmissor e preservar o segredo.');if(choice!=='1'&&choice!=='2')return;s.end=choice==='1'?'A sincronização foi interrompida. As provas vieram a público, mas uma segunda transmissão permanece.':'O sinal cessou. A cidade foi salva, mas o Projeto Horizonte continua oculto.';say(s.end);render()}
const iso=(x,y)=>[480+(x-y)*30,100+(x+y)*15];
function poly(p,color){g.fillStyle=color;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function building(a){let [x,y]=iso(a.x,a.y);let h=a.type==='tower'?70:45;poly([[x-24,y],[x,y+12],[x,y+12-h],[x-24,y-h]],'#776d59');poly([[x,y+12],[x+24,y],[x+24,y-h],[x,y+12-h]],'#514b45');poly([[x-30,y-h],[x,y-h-20],[x+30,y-h],[x,y-h+15]],a.type==='tower'?'#719198':'#974f49');g.fillStyle='#d4c58b';g.fillRect(x-10,y-h+17,8,12);g.fillStyle='#f3d797';g.font='12px system-ui';g.textAlign='center';g.fillText(a.name,x,y-h-25)}
function person(x,y){g.fillStyle='#142a31';g.fillRect(x-6,y-2,12,5);g.fillStyle='#343d54';g.fillRect(x-5,y-17,4,17);g.fillRect(x+1,y-17,4,17);g.fillStyle='#b8a05f';g.fillRect(x-8,y-32,16,17);g.fillStyle='#dfb38c';g.fillRect(x-6,y-43,12,12);g.fillStyle='#533d32';g.fillRect(x-7,y-45,14,5)}
function render(){g.fillStyle=hour()>=19||hour()<6?'#121f34':'#243d46';g.fillRect(0,0,c.width,c.height);for(let x=0;x<14;x++)for(let y=0;y<14;y++){let [a,b]=iso(x,y);poly([[a,b-15],[a+30,b],[a,b+15],[a-30,b]],x===5||y===6?'#82765a':(x+y)%2?'#496d50':'#507757');if((x*13+y*7)%11===0&&x!==5&&y!==6&&!sites.some(z=>z.x===x&&z.y===y)){g.fillStyle='#354e3c';g.fillRect(a-2,b-12,4,12);poly([[a-10,b-10],[a,b-32],[a+10,b-10]],'#284f40')}}let objects=[...sites,{x:s.x,y:s.y,player:true}].sort((a,b)=>a.x+a.y-b.x-b.y);for(let a of objects){if(a.player)person(...iso(a.x,a.y));else building(a)}if(hour()>=19||hour()<6){g.fillStyle='#111c4b55';g.fillRect(0,0,c.width,c.height)}$('hud').textContent='Dia '+day()+'/30 · '+String(hour()).padStart(2,'0')+':'+String(s.t%60).padStart(2,'0');$('clues').textContent=[...sites.filter(a=>s.clues.includes(a.id)).map(a=>a.name),...Object.keys(notes).filter(k=>s.clues.includes(k)).map(k=>notes[k])].join(' • ')||'Nenhuma evidência';caseboard();$('theory').textContent=s.end|| (s.theory?'Hipótese confirmada':'Em investigação')}
const keys={w:[0,-1],a:[-1,0],s:[0,1],d:[1,0],arrowup:[0,-1],arrowleft:[-1,0],arrowdown:[0,1],arrowright:[1,0]};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(keys[k]){e.preventDefault();move(...keys[k])}if(k==='e')interact()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>move(...b.dataset.m.split(',').map(Number)));$('act').onclick=interact;$('wait').onclick=()=>{if(!s.end){advance(60);render()}};$('link').onclick=link;$('final').onclick=finish;$('save').onclick=()=>{try{localStorage.setItem('fz-v1',JSON.stringify(s));say('Progresso salvo neste navegador.')}catch{say('Não foi possível salvar.')}};$('reset').onclick=()=>{if(confirm('Recomeçar?')){s=fresh();try{localStorage.removeItem('fz-v1')}catch{}say('Uma carta do seu tio o trouxe a Vale do Cedro.');render()}};say(s.end||'Uma carta do seu tio o trouxe a Vale do Cedro. Investigue a casa, encontre a médica e procure respostas.');render();
</script></html>
