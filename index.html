<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frequência Zero</title><style>*{box-sizing:border-box}body{margin:0;background:#101b23;color:#e4e9dc;font:16px system-ui}header,aside{padding:18px;background:#1b2a33}header{display:flex;justify-content:space-between;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(0,1fr) 320px}canvas{width:100%;background:#132b32;image-rendering:pixelated;touch-action:none}button{background:#31544e;color:white;border:1px solid #80a797;padding:10px;margin:3px;border-radius:5px;cursor:pointer}h1{margin:0;font-size:24px}small{color:#a6b9b5}#log{min-height:100px;white-space:pre-wrap}#clues{line-height:1.6} @media(max-width:800px){main{display:block}}</style><header><h1>FREQUÊNCIA ZERO <small> / O último sinal</small></h1><span id="hud"></span></header><main><section><canvas id="world" width="960" height="620" aria-label="Mapa isométrico"></canvas><div id="controls"><button data-m="0,-1">↑</button><button data-m="-1,0">←</button><button data-m="1,0">→</button><button data-m="0,1">↓</button><button id="act">Investigar [E]</button><button id="wait">Esperar 1h</button><button id="save">Salvar</button><button id="reset">Recomeçar</button></div><small>WASD ou setas • aproxime-se de um ponto marcado • E para interagir</small></section><aside><h2>Diário de campo</h2><p id="log" aria-live="polite"></p><h3>Evidências</h3><div id="clues"></div><h3>Hipóteses</h3><button id="link">Cruzar evidências</button><button id="final">Decidir destino do sinal</button><p id="theory"></p></aside></main><script>
'use strict';
const $=id=>document.getElementById(id),c=$('world'),g=c.getContext('2d');
const sites=[{x:3,y:3,name:'Casa do tio',type:'house',id:'radio',text:'Uma fita registra uma transmissão às 03:17. O tio anotou: não é uma invasão, é um aviso.'},{x:8,y:3,name:'Clínica',type:'house',id:'clinic',text:'A médica Lia revela que os lapsos de memória coincidem com os pulsos do observatório.'},{x:3,y:9,name:'Arquivo municipal',type:'house',id:'file',text:'O Projeto Horizonte pretende amplificar o sinal no trigésimo dia. A ordem tem assinatura governamental.'},{x:10,y:9,name:'Observatório',type:'tower',id:'signal',text:'O espectrograma mostra duas frequências: uma de sincronização e outra que pode interrompê-la.'},{x:11,y:4,name:'Posto de vigilância',type:'house',id:'guard',text:'O agente Raul admite que o projeto foi infiltrado. Ele teme tanto os superiores quanto o sinal.'}];
const fresh=()=>({x:5,y:5,t:480,clues:[],theory:false,end:null,trust:0});let s=fresh();try{const a=JSON.parse(localStorage.getItem('fz-v1'));if(a&&Number.isFinite(a.x)&&Number.isFinite(a.y)&&Number.isFinite(a.t)&&Array.isArray(a.clues)&&a.x>=0&&a.x<14&&a.y>=0&&a.y<14)s=a}catch{}
const say=t=>{$('log').textContent=t};const day=()=>1+Math.floor(s.t/1440),hour=()=>Math.floor(s.t%1440/60);
function advance(n){s.t+=n;if(day()>30&&!s.end){s.end='O pulso foi ativado. Vale do Cedro perdeu contato com o mundo.';say(s.end)}}
function move(dx,dy){if(s.end)return;let x=s.x+dx,y=s.y+dy;if(x<0||y<0||x>=14||y>=14||sites.some(a=>a.x===x&&a.y===y))return;s.x=x;s.y=y;advance(8);render()}
function interact(){if(s.end)return;let a=sites.find(a=>Math.abs(a.x-s.x)+Math.abs(a.y-s.y)<=1);if(!a){say('Aproxime-se de um edifício marcado.');return}if(a.id==='guard'&&(hour()<18&&hour()>5)){say('Raul só fala depois das 18h.');return}if(a.id==='clinic'&&(hour()<8||hour()>=18)){say('A clínica funciona das 08h às 18h.');return}if(!s.clues.includes(a.id)){s.clues.push(a.id);advance(40)}say(a.text);render()}
function link(){if(s.end)return;if(['radio','clinic','file','signal'].every(x=>s.clues.includes(x))){s.theory=true;say('Hipótese confirmada: o governo está amplificando um sinal de sincronização. A frequência inversa pode impedir o evento.')}else say('Ainda faltam evidências independentes para sustentar a hipótese.');render()}
function finish(){if(s.end)return;if(!s.theory){say('Sem uma hipótese confirmada, agir seria precipitado.');return}if(Math.abs(s.x-10)+Math.abs(s.y-9)>1){say('Vá ao observatório para alterar o transmissor.');return}let choice=prompt('1 — Inverter a frequência e divulgar as provas. 2 — Desligar o transmissor e preservar o segredo.');if(choice!=='1'&&choice!=='2')return;s.end=choice==='1'?'A sincronização foi interrompida. As provas vieram a público, mas uma segunda transmissão permanece.':'O sinal cessou. A cidade foi salva, mas o Projeto Horizonte continua oculto.';say(s.end);render()}
const iso=(x,y)=>[480+(x-y)*30,100+(x+y)*15];
function poly(p,color){g.fillStyle=color;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function building(a){let [x,y]=iso(a.x,a.y);let h=a.type==='tower'?70:45;poly([[x-24,y],[x,y+12],[x,y+12-h],[x-24,y-h]],'#776d59');poly([[x,y+12],[x+24,y],[x+24,y-h],[x,y+12-h]],'#514b45');poly([[x-30,y-h],[x,y-h-20],[x+30,y-h],[x,y-h+15]],a.type==='tower'?'#719198':'#974f49');g.fillStyle='#d4c58b';g.fillRect(x-10,y-h+17,8,12);g.fillStyle='#f3d797';g.font='12px system-ui';g.textAlign='center';g.fillText(a.name,x,y-h-25)}
function person(x,y){g.fillStyle='#142a31';g.fillRect(x-6,y-2,12,5);g.fillStyle='#343d54';g.fillRect(x-5,y-17,4,17);g.fillRect(x+1,y-17,4,17);g.fillStyle='#b8a05f';g.fillRect(x-8,y-32,16,17);g.fillStyle='#dfb38c';g.fillRect(x-6,y-43,12,12);g.fillStyle='#533d32';g.fillRect(x-7,y-45,14,5)}
function render(){g.fillStyle=hour()>=19||hour()<6?'#121f34':'#243d46';g.fillRect(0,0,c.width,c.height);for(let x=0;x<14;x++)for(let y=0;y<14;y++){let [a,b]=iso(x,y);poly([[a,b-15],[a+30,b],[a,b+15],[a-30,b]],x===5||y===6?'#82765a':(x+y)%2?'#496d50':'#507757');if((x*13+y*7)%11===0&&x!==5&&y!==6&&!sites.some(z=>z.x===x&&z.y===y)){g.fillStyle='#354e3c';g.fillRect(a-2,b-12,4,12);poly([[a-10,b-10],[a,b-32],[a+10,b-10]],'#284f40')}}let objects=[...sites,{x:s.x,y:s.y,player:true}].sort((a,b)=>a.x+a.y-b.x-b.y);for(let a of objects){if(a.player)person(...iso(a.x,a.y));else building(a)}if(hour()>=19||hour()<6){g.fillStyle='#111c4b55';g.fillRect(0,0,c.width,c.height)}$('hud').textContent='Dia '+day()+'/30 · '+String(hour()).padStart(2,'0')+':'+String(s.t%60).padStart(2,'0');$('clues').textContent=sites.filter(a=>s.clues.includes(a.id)).map(a=>a.name).join(' • ')||'Nenhuma evidência';$('theory').textContent=s.end|| (s.theory?'Hipótese confirmada':'Em investigação')}
const keys={w:[0,-1],a:[-1,0],s:[0,1],d:[1,0],arrowup:[0,-1],arrowleft:[-1,0],arrowdown:[0,1],arrowright:[1,0]};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(keys[k]){e.preventDefault();move(...keys[k])}if(k==='e')interact()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>move(...b.dataset.m.split(',').map(Number)));$('act').onclick=interact;$('wait').onclick=()=>{if(!s.end){advance(60);render()}};$('link').onclick=link;$('final').onclick=finish;$('save').onclick=()=>{try{localStorage.setItem('fz-v1',JSON.stringify(s));say('Progresso salvo neste navegador.')}catch{say('Não foi possível salvar.')}};$('reset').onclick=()=>{if(confirm('Recomeçar?')){s=fresh();try{localStorage.removeItem('fz-v1')}catch{}say('Uma carta do seu tio o trouxe a Vale do Cedro.');render()}};say(s.end||'Uma carta do seu tio o trouxe a Vale do Cedro. Investigue a casa, encontre a médica e procure respostas.');render();
</script></html>
