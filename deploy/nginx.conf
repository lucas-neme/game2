server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 absolute_redirect off;
 server_tokens off;
 location = /game2 { return 308 /game2/; }
 # Versioned assets (v/<hash of the assets tree>/assets/...): the URL changes whenever the content changes.
 location ~ "^/game2/v/[0-9a-f]{6,40}/assets/" {
  rewrite ^/game2/v/[0-9a-f]+/(assets/.*)$ /game2/$1 break;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
 }
 location = /game2/version.json {
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
 }
 location /game2/ {
  try_files $uri $uri/ =404;
  # Unversioned asset URLs (built at runtime, e.g. from manifests) are revalidated with ETag on every load.
  location /game2/assets/ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
 }
 location = /healthz { access_log off; return 200 "ok\n"; }
 location / { return 404; }
}
