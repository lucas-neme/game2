# Merge inside the existing HTTPS server block for wampa.com.br.
# Preserve the existing /vanguarda and other application locations.
location = /game2 { return 308 /game2/; }
location /game2/ {
    proxy_pass http://127.0.0.1:8092;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
