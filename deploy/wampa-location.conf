# Nginx Proxy Manager > wampa.com.br (proxy host 17) > Advanced.
# Only adds /game2; the default "location /" (Wampa site) stays as generated by NPM.
# The upstream is a variable, so NPM still starts if game2-web is down (it uses Docker DNS at request time).
location = /game2 { absolute_redirect off; return 308 /game2/; }
location ^~ /game2/ {
    set $game2_upstream game2-web;
    proxy_pass http://$game2_upstream:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
