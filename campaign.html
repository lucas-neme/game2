<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frequência Zero — laboratório de campanha</title><style>*{box-sizing:border-box}body{margin:0;background:#101b23;color:#e4e9dc;font:16px system-ui}header,aside{padding:18px;background:#1b2a33}header{display:flex;justify-content:space-between;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(0,1fr) 320px}canvas{width:100%;background:#132b32;image-rendering:pixelated;touch-action:none}button{background:#31544e;color:white;border:1px solid #80a797;padding:10px;margin:3px;border-radius:5px;cursor:pointer}h1{margin:0;font-size:24px}small{color:#a6b9b5}#log{min-height:100px;white-space:pre-wrap}#clues{line-height:1.6} @media(max-width:800px){main{display:block}}</style><header><h1>FREQUÊNCIA ZERO <small> / O último sinal</small></h1><span id="hud"></span></header><main><section><canvas id="world" width="960" height="620" aria-label="Mapa isométrico"></canvas><div id="controls"><button data-m="0,-1">↑</button><button data-m="-1,0">←</button><button data-m="1,0">→</button><button data-m="0,1">↓</button><button id="act">Investigar [E]</button><button id="wait">Esperar 1h</button><button id="save">Salvar</button><button id="reset">Recomeçar</button></div><small>WASD ou setas • aproxime-se de um ponto marcado • E para interagir</small></section><aside><h2>Diário de campo</h2><p id="log" aria-live="polite"></p><h3>Evidências</h3><div id="clues"></div><h3>Ocorrências da cidade</h3><div id='events'></div><details><summary>Rotina dos moradores</summary><div id='schedule'></div></details><h3>Rádio portátil</h3><label>Frequência <input id='freq' type='range' min='80' max='110' step='0.1' value='90'></label><output id='freqout'>90.0</output><button id='tune'>Escutar</button><h3>Objetos e enigmas</h3><div id="puzzle"></div><h3>Conversas</h3><div id="dialog"></div><h3>Casos em aberto</h3><div id="cases"></div><h3>Hipóteses</h3><button id="link">C const fresh=()=>({x:5,y:5,t:480,clues:[],theory:false,end:null,trust:0,relations:{},solved:[],attempts:{},events:[],journal:{},tuned:false,puzzles:[],puzzleHints:{}});let s=fresh();$('dialog').replaceChildren();try{const a=JSON.parse(localStorage.getItem('fz-v1'));if(a&&Number.isFinite(a.x)&&Number.isFinite(a.y)&&Number.isFinite(a.t)&&Array.isArray(a.clues)&&a.x>=0&&a.x<14&&a.y>=0&&a.y<14)s=a}catch{}
s.relations??={};s.solved??=[];s.attempts??={};s.events??=[];s.journal??={};s.tuned??=false;s.puzzles??=[];s.puzzleHints??={};
const say=t=>{$('log').textContent=t};const day=()=>1+Math.floor(s.t/1440),hour=()=>Math.floor(s.t%1440/60);
Object.assign(notes,{safe:'Carta lacrada: a remessa H-17 chega pela ferrovia; procure a estação às 03h17.',power:'Painel restaurado: os pulsos persistem sem energia externa.',cipher:'Bilhete decifrado: NÃO AMPLIFIQUE.',door:'O abrigo contém uma planta da infraestrutura Horizonte.',sequence:'Registro do ensaio: a onda inversa deve ser testada antes de ativar o emissor.'});
const timeline=[[2,'Uma queda de energia interrompe a rádio.'],[6,'O jornal anuncia um desaparecimento.'],[13,'Veículos oficiais chegam à cidade.'],[21,'O lago emite luz durante a noite.'],[28,'O observatório transmite continuamente.']];
function record(id){if(!s.clues.includes(id))s.clues.push(id);s.journal[id]??={day:day(),hour:hour()}}
function advance(n){s.t+=n;for(const [d,msg] of timeline)if(day()>=d&&!s.events.includes(msg))s.events.push(msg);if(day()>30&&!s.end){s.end='O pulso foi ativado. Vale do Cedro perdeu contato com o mundo.';say(s.end)}}
function move(dx,dy){if(s.end)return;let x=s.x+dx,y=s.y+dy;if(x<0||y<0||x>=14||y>=14||sites.some(a=>a.x===x&&a.y===y))return;s.x=x;s.y=y;$('dialog').replaceChildren();$('puzzle').replaceChildren();advance(8);render()}
function interact(){if(s.end)return;let npc=nearbyNpc();let a=npc?{...sites.find(z=>z.id===npc.id),x:npc.x,y:npc.y}:sites.find(a=>Math.abs(a.x-s.x)+Math.abs(a.y-s.y)<=1);if(!a){say('Aproxime-se de um edifício marcado.');return}if(!npc&&a.id==='guard'&&(hour()<18&&hour()>5)){say('Raul só fala depois das 18h.');return}if(!npc&&a.id==='clinic'&&(hour()<8||hour()>=18)){say('A clínica funciona das 08h às 18h.');return}if(!s.clues.includes(a.id)){record(a.id);advance(40)}say(a.text);if(a.id==='rail'&&hour()===3){record('cargo');say(a.text+' Um manifesto de carga caiu junto aos trilhos.')}dialog(a);puzzle(a);render()}
function dialog(a){const el=$('dialog');el.replaceChildren();const lines={
clinic:[['Perguntar com discrição','Lia: Você sabe o que é guardar um segredo para proteger alguém?',1],['Mostrar a fita do tio','Lia: Ele me pediu para nunca deixar o paciente sozinho.',1,'patient','radio'],['Acusar a clínica','Lia: Sem provas, não temos mais nada a conversar.',-1]],
guard:[['Ouvir sem pressionar','Raul: Nem todo homem de uniforme escolheu estar aqui.',1],['Perguntar sobre a ferrovia','Raul: Eu estava de guarda naquela madrugada.',1,'witness','rail'],['Mostrar documentos duplicados','Raul: São identidades de proteção.',1,'protection','duplicate']],
future:[['Pedir o livro de ocorrências','Locutora: Anotei os horários. Ninguém quis me ouvir.',1,'outage']],

medal:[['Conversar com a família','A avó da menina tinha o mesmo nome.',1,'family','photo']],
file:[['Buscar alvarás','Encontrei o alvará do abrigo.',0,'permit','room'],['Consultar identidades','Dois documentos compartilham o número.',0,'duplicate'],['Consultar remessas','A remessa H-17 segue para o observatório.',0,'cargo','rail']],
news:[['Comparar horários','A previsão foi registrada antes do apagão.',0,'prediction','future']],

for(const [label,line,delta,clue,required] of lines[a.id]||[]){const b=document.createElement('button');b.textContent=label;b.disabled=!!required&&!s.clues.includes(required);b.onclick=()=>{if(s.end)return;if(Math.abs(a.x-s.x)+Math.abs(a.y-s.y)>1){say('Volte ao local para conversar.');return}const key=a.id+':'+label;if(!s.attempts[key]){s.attempts[key]=1;s.relations[a.id]=Math.max(-3,Math.min(3,(s.relations[a.id]||0)+delta));advance(15)}if(clue&&!s.clues.includes(clue)&&s.relations[a.id]>=0)record(clue);say(line);render()};el.append(b)}}

radio:{id:'safe',title:'Cofre do tio',description:'A etiqueta do cofre diz: o instante em que tudo começou. Quatro algarismos.',kind:'code',answer:'0317',hints:['Leia a fita encontrada na casa.','Use o horário sem os dois pontos.'],reward:'safe'},

function puzzle(a){const el=$('puzzle');el.replaceChildren();const p=puzzles[a.id];if(!p||s.end)return;const title=document.createElement('strong');title.textContent=p.title;el.append(title);const desc=document.createElement('p');desc.textContent=s.puzzles.includes(p.id)?'Enigma resolvido. Evidência no diário.':p.description;el.append(desc);if(s.puzzles.includes(p.id))return;if(p.need&&!p.need.every(n=>s.clues.includes(n))){desc.textContent+=' Faltam informações de outros locais.';return}const valid=()=>!s.end&&Math.abs(a.x-s.x)+Math.abs(a.y-s.y)<=1;const solve=()=>{if(!valid())return;record(p.reward);s.puzzles.push(p.id);advance(10);say(notes[p.reward]);puzzle(a);render()};const button=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;el.append(b);return b};if(p.kind==='code'){const input=document.createElement('input');input.setAttribute('aria-label','Resposta do enigma');input.maxLength=32;input.autocomplete='off';el.append(input);const check=()=>{if(!valid())return;if(input.value.trim().toUpperCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')===p.answer)solve();else say('Não encaixa. Revise suas evidências; nenhuma tentativa é perdida.')};button('Verificar',check);input.onkeydown=e=>{if(e.key==='Enter')check()}}else{let selected=[];const status=document.createElement('p');status.setAttribute('aria-live','polite');el.append(status);p.options.forEach(o=>button(o,()=>{if(!valid()||selected.includes(o))return;selected.push(o);status.textContent=selected.join(' → ');if(selected.length===p.answer.length){if(selected.every((v,i)=>v===p.answer[i]))solve();else{say('Ordem incorreta. O painel voltou ao estado inicial.');selected=[];status.textContent=''}}}));button('Limpar sequência',()=>{selected=[];status.textContent=''})}button('Pedir dica',()=>{let n=s.puzzleHints[p.id]||0;say(p.hints[Math.min(n,p.hints.length-1)]);s.puzzleHints[p.id]=n+1})}
function caseboard(){const el=$('cases');el.replaceChildren();for(const k of cases){const box=document.createElement('div');const title=document.createElement('p');title.textContent=k.title+' — '+(s.solved.includes(k.id)?'Resolvido':k.need.filter(n=>s.clues.includes(n)).length+'/'+k.need.length+' indícios');box.append(title);if(!s.solved.includes(k.id)){const hint=document.createElement('button');hint.textContent='Revisar pistas';hint.onclick=()=>say(k.hint);box.append(hint);if(k.need.every(n=>s.clues.includes(n))){const q=document.createElement('p');q.textContent=k.question;box.append(q);k.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(s.end)return;if(i===k.answer){s.solved.push(k.id);say(k.result);render()}else say('Essa conclusão vai além dos fatos. '+k.hint)};box.append(b)})}}el.append(box)}}
function link(){if(s.end)return;if(['radio','clinic','file','signal'].every(x=>s.clues.includes(x))){s.theory=true;say('Hipótese confirmada: o governo está amplificando um sinal de sincronização. A frequência inversa pode impedir o evento.')}else say('Ainda faltam evidências independentes para sustentar a hipótese.');render()}
function finish(){if(s.end)return;if(!s.theory||!s.solved.includes('zero')||!s.puzzles.includes('sequence')){say('Sem uma hipótese confirmada, agir seria precipitado.');return}if(Math.abs(s.x-10)+Math.abs(s.y-9)>1){say('Vá ao observatório para alterar o transmissor.');return}let choice=prompt('1 — Inverter a frequência e divulgar as provas. 2 — Desligar o transmissor e preservar o segredo.');if(choice!=='1'&&choice!=='2')return;s.end=choice==='1'?'A sincronização foi interrompida. As provas vieram a público, mas uma segunda transmissão permanece.':'O sinal cessou. A cidade foi salva, mas o Projeto Horizonte continua oculto.';say(s.end);render()}

function building(a){let [x,y]=iso(a.x,a.y);let h=a.type==='tower'?70:45;poly([[x-24,y],[x,y+12],[x,y+12-h],[x-24,y-h]],'#776d59');poly([[x,y+12],[x+24,y],[x+24,y-h],[x,y+12-h]],'#514b45');poly([[x-30,y-h],[x,y-h-20],[x+30,y-h],[x,y-h+15]],a.type==='tower'?'#719198':'#974f49');g.fillStyle='#d4c58b';g.fillRect(x-10,y-h+17,8,12);g.fillStyle='#f3d797';g.font='12px system-ui';g.textAlign='center';g.fillText(a.name,x,y-h-25)}
