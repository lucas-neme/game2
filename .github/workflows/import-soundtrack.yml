name: Import licensed soundtrack
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import-soundtrack.mjs'
      - '.github/workflows/import-soundtrack.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: soundtrack-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/import-soundtrack.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/music/*.mp3 assets/music/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(audio): import verified CC BY soundtrack tracks"
          git push origin HEAD:main
